# Baza danych apteki - Oracle Database 23ai Free
# Start:   docker compose up -d
# Logi:    docker compose logs -f oracle
# Stop:    docker compose down          (dane zostaja w wolumenie)
# Reset:   docker compose down -v       (USUWA wszystkie dane, init/ wykona sie ponownie)

services:
  oracle:
    image: ${ORACLE_IMAGE:-gvenzl/oracle-free:23-slim}
    container_name: apteka-db
    ports:
      - "127.0.0.1:1521:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      APP_USER: ${APP_USER}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}
      TZ: Europe/Warsaw
    volumes:
      - apteka-data:/opt/oracle/oradata
      # Skrypty *.sql / *.sh uruchamiane alfabetycznie TYLKO przy pierwszej inicjalizacji bazy.
      - ./db/init:/container-entrypoint-initdb.d:ro
      # Skrypty startowe uruchamiane przy każdym starcie Oracle, także na istniejącym wolumenie.
      - ./db/startup:/container-entrypoint-startdb.d:ro
      # Katalog roboczy na skrypty/CSV, dostepny w kontenerze jako /scripts
      - ./db/scripts:/scripts
      # CSV źródłowe dla automatycznego, wznawialnego loadera SQL*Loader.
      - ./data/przygotowane:/data/przygotowane:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

volumes:
  apteka-data:
